name: 编译 OpenAppFilter 为 ImmortalWrt 23.05.2 IPK

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 'ImmortalWrt SDK 下载地址 (默认为 23.05.2 x86_64)'
        required: true
        default: 'https://downloads.immortalwrt.org/releases/23.05.2/targets/x86/64/immortalwrt-sdk-23.05.2-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz'

jobs:
  build:
    name: 编译 OAF IPK 安装包
    runs-on: ubuntu-22.04

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装基础编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 \
            tar xz-utils file

      - name: 下载并解压 ImmortalWrt 官方 SDK
        run: |
          echo "下载 SDK: ${{ github.event.inputs.sdk_url }}"
          wget -c -t 3 --timeout=60 -O sdk.tar.xz "${{ github.event.inputs.sdk_url }}"
          mkdir -p sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1
          rm -f sdk.tar.xz

      - name: 配置编译工程并载入 OAF 插件
        run: |
          cd sdk
          # 1. 更新并安装 SDK 基础依赖 Feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 2. 彻底清理 feeds 中自带的旧版本 OAF (防止旧版本覆写当前 7.0 源码)
          ./scripts/feeds uninstall appfilter luci-app-oaf kmod-oaf 2>/dev/null || true
          rm -rf feeds/packages/net/appfilter 2>/dev/null || true
          rm -rf feeds/packages/net/open-app-filter 2>/dev/null || true
          rm -rf feeds/luci/applications/luci-app-oaf 2>/dev/null || true
          rm -rf package/feeds/packages/appfilter 2>/dev/null || true
          rm -rf package/feeds/luci/luci-app-oaf 2>/dev/null || true

          # 3. 将当前仓库真实的 OAF 7.0 各模块直接复制到 package 目录
          rm -rf package/luci-app-oaf package/oaf package/open-app-filter
          if [ -d "../OpenAppFilter-master/luci-app-oaf" ]; then
            cp -r ../OpenAppFilter-master/luci-app-oaf package/
            cp -r ../OpenAppFilter-master/oaf package/
            cp -r ../OpenAppFilter-master/open-app-filter package/
          else
            cp -r ../luci-app-oaf package/
            cp -r ../oaf package/
            cp -r ../open-app-filter package/
          fi

          # 4. 显式开启 OAF 7.0 相关模块编译
          echo "CONFIG_PACKAGE_kmod-oaf=m" >> .config
          echo "CONFIG_PACKAGE_appfilter=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-oaf=m" >> .config
          make defconfig

      - name: 编译 OpenAppFilter 7.0 相关包
        run: |
          cd sdk
          echo "==== 开始编译内核驱动模块 kmod-oaf ===="
          make package/oaf/compile V=s -j$(nproc)

          echo "==== 开始编译原生 7.0 用户态守护进程 appfilter ===="
          make package/open-app-filter/compile V=s -j$(nproc)

          echo "==== 开始编译 7.0 前端管理界面 luci-app-oaf ===="
          make package/luci-app-oaf/compile V=s -j$(nproc)

      - name: 收集与整理生成的 IPK 文件
        run: |
          mkdir -p output_ipks
          find sdk/bin/ -name "*oaf*.ipk" -exec cp {} output_ipks/ \;
          find sdk/bin/ -name "*appfilter*.ipk" -exec cp {} output_ipks/ \;
          echo "==== 成功编译出的 IPK 安装包列表 ===="
          ls -la output_ipks/

      - name: 上传编译产物到 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenAppFilter-v7.0-ImmortalWrt-23.05.2-IPKs
          path: output_ipks/*
